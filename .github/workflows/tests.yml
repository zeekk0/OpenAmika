name: tests

# The offline test suite (README_IF_YOU_ARE_AI_AGENT.md, section 10): no GPU, no models, no keys. Replay tests that
# need MekaHime's archived corpora skip themselves. -k "not live" deselects every test whose name contains "live" (a
# substring match): only a test that needs a running stack may be named so (test_live_*; none today), and
# tests/test_ci_filter.py keeps the word out of every other test name.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            brain/requirements.txt
            requirements-dev.txt
      - name: Install the brain and test dependencies
        run: python -m pip install -r brain/requirements.txt -r requirements-dev.txt
      - name: Offline test suite
        # The runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1\...); the memory store resolves its
        # folder to the long name, so the tests that compare backup paths need a temp folder without short names.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -m pytest tests -k "not live" -p no:cacheprovider -q

  korean-imports:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned scientific dependency wheels
        run: >-
          python -m pip install --only-binary=:all: numpy==1.26.4 scipy==1.17.1
      - name: Import scientific dependencies with the verification guard active
        shell: python -I -B {0}
        run: |
          import runpy
          probe = runpy.run_path("scripts/korean_voice_probe.py")
          probe["install_verification_guard"]()
          import numpy.testing
          import scipy.sparse
          assert not numpy.testing._private.utils._SUPPORTS_SVE
          assert not probe["_DENIED"]
